<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Counter App</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-indigo-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-sm bg-slate-800/80 backdrop-blur-md border border-slate-700/50 rounded-2xl shadow-2xl p-6 text-center">
        
        <!-- Header -->
        <h1 class="text-2xl font-bold tracking-tight mb-2 text-indigo-400">Counter App</h1>
        <p class="text-slate-400 text-sm mb-6">Click buttons to increment or decrement</p>

        <!-- Counter Display -->
        <div class="bg-slate-900/60 border border-slate-700/40 rounded-xl py-8 px-4 mb-6 shadow-inner">
            <span id="counterValue" class="text-6xl font-extrabold tracking-tight text-white transition-all duration-150">0</span>
        </div>

        <!-- Controls / Buttons -->
        <div class="grid grid-cols-2 gap-3 mb-4">
            <button id="decrementBtn" class="bg-rose-600 hover:bg-rose-500 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                </svg>
                Decrease
            </button>
            <button id="incrementBtn" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" />
                </svg>
                Increase
            </button>
        </div>

        <!-- Reset Button -->
        <button id="resetBtn" class="w-full bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-300 font-medium py-2.5 px-4 rounded-xl transition duration-200 text-sm">
            Reset Counter
        </button>
    </main>

    <script>
        // State variables
        let count = 0;

        // DOM elements
        const counterValueEl = document.getElementById('counterValue');
        const incrementBtn = document.getElementById('incrementBtn');
        const decrementBtn = document.getElementById('decrementBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Function to update display with animation effect
        function updateDisplay() {
            counterValueEl.textContent = count;
            
            // Dynamic color feedback based on value
            if (count > 0) {
                counterValueEl.className = "text-6xl font-extrabold tracking-tight text-emerald-400 transition-all duration-150";
            } else if (count < 0) {
                counterValueEl.className = "text-6xl font-extrabold tracking-tight text-rose-400 transition-all duration-150";
            } else {
                counterValueEl.className = "text-6xl font-extrabold tracking-tight text-white transition-all duration-150";
            }
        }

        // Event Listeners for actions
        incrementBtn.addEventListener('click', () => {
            count++;
            updateDisplay();
        });

        decrementBtn.addEventListener('click', () => {
            count--;
            updateDisplay();
        });

        resetBtn.addEventListener('click', () => {
            count = 0;
            updateDisplay();
        });
    </script>
</body>
</html>
